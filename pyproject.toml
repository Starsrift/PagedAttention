[project]
name = "pagedattention-experiments"
version = "0.1.0"
description = "Reproducible native Windows PagedAttention mechanism experiments"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.2.6",
    "torch==2.10.0+cu126",
    "transformers==4.57.6",
]

[tool.uv]
package = false
cache-dir = ".local/uv-cache"
python-preference = "only-managed"
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
